name: Release

# Called by release-please.yml (push to main) after it creates the vX.Y.Z tag
# + GitHub Release. GITHUB_TOKEN tag/release events don't start workflows, so
# this is a reusable workflow, not a tag trigger.
#
# One unified version for all 11 services:
#   - services whose dependency closure changed since the previous release are
#     compiled (amd64 + arm64 on native runners) and pushed as new images;
#   - unchanged services only get the new tag added to their existing image
#     (`buildx imagetools create`, manifest copy, no rebuild, no layer upload).
# No `latest` tag. Docker Hub + Aliyun ACR (Docker schema2 media types).
on:
  workflow_call:
    inputs:
      version:
        description: "Release version (with or without v prefix); must match VERSION"
        required: true
        type: string
      push:
        description: "Push images / tags to the registries (false = build-only dry run)"
        required: false
        type: boolean
        default: true
      rehearsal:
        description: "Rehearsal from a non-main branch: version must contain '-rehearsal', no Release notes, VERSION not checked"
        required: false
        type: boolean
        default: false
      images:
        description: "Comma list of image names to restrict to (rehearsal only; empty = all 11)"
        required: false
        type: string
        default: ''
      base_version:
        description: "Previous version to diff / re-tag from (empty = latest earlier v* tag)"
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  HUB_NS: dex2all
  ACR_REGISTRY: crpi-wtjtitem0hw3am2j.cn-shanghai.personal.cr.aliyuncs.com
  ACR_NS: crpi-wtjtitem0hw3am2j.cn-shanghai.personal.cr.aliyuncs.com/dex2all
  RUST_TOOLCHAIN: '1.99.1'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  NODE_VERSION: '20.19.2'
  PNPM_VERSION: '10.34.6'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version and enforce main-only
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REHEARSAL: ${{ inputs.rehearsal }}
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          V="${INPUT_VERSION#v}"
          [ -n "$V" ] || { echo "::error::version is empty"; exit 1; }
          if [ "$REHEARSAL" = "true" ]; then
            case "$V" in *-rehearsal*) ;; *) echo "::error::rehearsal version must contain '-rehearsal' (got $V)"; exit 1;; esac
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::releases are only published from main (ref=$GITHUB_REF)"; exit 1
            fi
            if [ -n "$IMAGES" ]; then
              echo "::error::'images' override is rehearsal-only"; exit 1
            fi
            FILE_V="$(awk '{print $1; exit}' VERSION)"
            if [ "$FILE_V" != "$V" ]; then
              echo "::error::version mismatch: release=$V VERSION=$FILE_V"; exit 1
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V (rehearsal=$REHEARSAL push=${{ inputs.push }})"

  # Frontend dist for the mgmt embed, built in this workflow so compile does
  # not wait for the gate. Artifact name differs from the gate's
  # "mazbri-web-dist" (same run, artifact names must be unique).
  frontend:
    name: frontend dist
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mazbri-web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: mazbri-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` = vite build && vue-tsc --noEmit (same as the gate)
      - name: Build (vite + vue-tsc)
        run: pnpm build

      - name: Upload dist for mgmt embed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web-dist
          path: mazbri-web/dist
          if-no-files-found: error
          retention-days: 3

  # Strict gate again right before release (decision 6: PR + pre-release).
  # Runs in parallel with compile; nothing is pushed or published unless it
  # succeeds (image / retag / notes all need it).
  gate:
    needs: meta
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  plan:
    needs: meta
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      reuse: ${{ steps.plan.outputs.reuse }}
      build_count: ${{ steps.plan.outputs.build_count }}
      reuse_count: ${{ steps.plan.outputs.reuse_count }}
      packages: ${{ steps.plan.outputs.packages }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute build / reuse sets
        id: detect
        env:
          V: ${{ needs.meta.outputs.version }}
          BASE_INPUT: ${{ inputs.base_version }}
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          BASE="${BASE_INPUT#v}"
          if [ -z "$BASE" ]; then
            # latest earlier release tag that is an ancestor of HEAD
            while IFS= read -r t; do
              [ "$t" = "v$V" ] && continue
              if git merge-base --is-ancestor "$t" HEAD; then BASE="${t#v}"; break; fi
            done < <(git tag -l 'v[0-9]*' --sort=-v:refname)
          fi
          (cd mazbri-bin && cargo metadata --format-version 1 --locked) > /tmp/metadata.json
          if [ -z "$BASE" ]; then
            echo "No previous release: build everything"
            python3 .github/scripts/detect.py /tmp/metadata.json --all > /tmp/plan.json
          elif git rev-parse -q --verify "refs/tags/v$BASE" >/dev/null; then
            echo "Diff v$BASE..HEAD"
            git diff --name-only "v$BASE" HEAD > /tmp/changed.txt
            cat /tmp/changed.txt
            git show "v$BASE:mazbri-bin/Cargo.lock" > /tmp/old.lock 2>/dev/null || : > /tmp/old.lock
            python3 .github/scripts/detect.py /tmp/metadata.json /tmp/changed.txt /tmp/old.lock mazbri-bin/Cargo.lock > /tmp/plan.json
          else
            # rehearsal: base images exist in the registries but have no git tag
            echo "::warning::base v$BASE has no git tag; treating source as unchanged"
            : > /tmp/changed.txt
            python3 .github/scripts/detect.py /tmp/metadata.json /tmp/changed.txt > /tmp/plan.json
          fi
          # rehearsal-only restriction
          python3 - "$IMAGES" <<'PY'
          import json, sys
          only = {s.strip() for s in sys.argv[1].split(",") if s.strip()}
          p = json.load(open("/tmp/plan.json"))
          if only:
              known = {e["image"] for e in p["build"] + p["reuse"]}
              bad = only - known
              if bad: sys.exit(f"unknown images: {bad}")
              p = {k: [e for e in v if e["image"] in only] for k, v in p.items()}
          json.dump(p, open("/tmp/plan.json", "w"))
          PY
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "plan.json: $(cat /tmp/plan.json)"

      - name: Fall back to build when a base image is missing
        id: plan
        env:
          BASE: ${{ steps.detect.outputs.base }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          p = json.load(open("/tmp/plan.json"))
          base, ns = os.environ["BASE"], os.environ["HUB_NS"]
          reuse = []
          for e in p["reuse"]:
              ref = f"{ns}/{e['image']}:{base}"
              ok = subprocess.run(["docker", "buildx", "imagetools", "inspect", ref],
                                  capture_output=True).returncode == 0
              if ok:
                  reuse.append(e)
              else:
                  print(f"::warning::{ref} not found, will rebuild {e['image']}")
                  p["build"].append(e)
          p["reuse"] = reuse
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          out.write(f"build={json.dumps(p['build'])}\n")
          out.write(f"reuse={json.dumps(p['reuse'])}\n")
          out.write(f"build_count={len(p['build'])}\n")
          out.write(f"reuse_count={len(p['reuse'])}\n")
          out.write("packages=" + " ".join(f"-p {e['package']}" for e in p["build"]) + "\n")
          out.write(f"base={base}\n")
          s = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          s.write(f"### Release plan (base: {base or 'none'})\n\n")
          s.write("Build: " + (", ".join(e["image"] for e in p["build"]) or "-") + "\n\n")
          s.write("Re-tag: " + (", ".join(e["image"] for e in p["reuse"]) or "-") + "\n")
          PY

  compile:
    name: compile (${{ matrix.arch }})
    needs: [meta, plan, frontend]
    if: needs.plan.outputs.build_count != '0'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dist from the frontend job above (mgmt embeds it)
      - name: Download frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-web-dist
          path: mazbri-web/dist

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mazbri-bin
          shared-key: release-${{ matrix.arch }}
          # called from release-please.yml on push to main: ref is refs/heads/main
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo build --release
        working-directory: mazbri-bin
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          cargo build --release --locked $PACKAGES

      - name: Collect binaries
        env:
          BUILD: ${{ needs.plan.outputs.build }}
        run: |
          set -euo pipefail
          mkdir -p out/${{ matrix.arch }}
          for b in $(jq -r '.[].bin' <<<"$BUILD"); do
            cp "mazbri-bin/target/release/$b" out/${{ matrix.arch }}/
          done
          file out/${{ matrix.arch }}/*
          # runtime is debian trixie (glibc 2.41); fail early if a binary needs more
          for f in out/${{ matrix.arch }}/*; do
            need="$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
            echo "$(basename "$f"): max $need"
            [ "$(printf '%s\nGLIBC_2.41\n' "$need" | sort -V | tail -1)" = "GLIBC_2.41" ] \
              || { echo "::error::$f needs $need > GLIBC_2.41"; exit 1; }
          done

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bins-${{ matrix.arch }}
          path: out
          if-no-files-found: error
          retention-days: 3

  image:
    name: image ${{ matrix.svc.image }}
    # gate must pass before anything is pushed
    needs: [meta, gate, plan, compile]
    if: needs.plan.outputs.build_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        svc: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bins-*
          merge-multiple: true
          path: bins

      - name: Prepare build context
        run: |
          set -euo pipefail
          for a in amd64 arm64; do
            mkdir -p ctx/$a
            cp "bins/$a/${{ matrix.svc.bin }}" ctx/$a/
          done
          ls -la ctx/*

      # only the runtime stage's apt-get runs under emulation for arm64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun ACR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build${{ inputs.push && ' and push' || ' (dry run)' }}
        env:
          V: ${{ needs.meta.outputs.version }}
          IMG: ${{ matrix.svc.image }}
          BIN: ${{ matrix.svc.bin }}
          BOOT: ${{ matrix.svc.bootstrap }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          SVC="${BOOT%-bootstrap.toml}"
          # Personal ACR rejects OCI manifests: emit Docker schema2 for both
          # registries; no provenance/sbom attestations (they force OCI index).
          for i in 1 2 3 4; do
            if docker buildx build \
                --platform linux/amd64,linux/arm64 \
                --file docker/Dockerfile \
                --build-arg BIN="$BIN" --build-arg SVC="$SVC" \
                --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
                --label org.opencontainers.image.revision="${GITHUB_SHA}" \
                --label org.opencontainers.image.version="$V" \
                --provenance=false --sbom=false \
                --output "type=image,push=${PUSH},oci-mediatypes=false" \
                --tag "${HUB_NS}/${IMG}:${V}" \
                --tag "${ACR_NS}/${IMG}:${V}" \
                ctx; then
              exit 0
            fi
            echo "::warning::build/push attempt $i failed, retrying in $((i*20))s"
            sleep $((i*20))
          done
          exit 1

      - name: Verify pushed manifests
        if: inputs.push
        env:
          V: ${{ needs.meta.outputs.version }}
          IMG: ${{ matrix.svc.image }}
        run: |
          set -euo pipefail
          for ref in "${HUB_NS}/${IMG}:${V}" "${ACR_NS}/${IMG}:${V}"; do
            raw="$(docker buildx imagetools inspect --raw "$ref")"
            echo "$ref -> $(jq -r .mediaType <<<"$raw") [$(jq -r '[.manifests[].platform.architecture]|join(",")' <<<"$raw")]"
            jq -e '[.manifests[].platform.architecture] | index("amd64") and index("arm64")' <<<"$raw" >/dev/null
          done

  retag:
    name: retag ${{ matrix.svc.image }}
    needs: [meta, gate, plan]
    if: needs.plan.outputs.reuse_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        svc: ${{ fromJSON(needs.plan.outputs.reuse) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun ACR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Add tag ${{ needs.meta.outputs.version }} to existing image
        env:
          V: ${{ needs.meta.outputs.version }}
          BASE: ${{ needs.plan.outputs.base }}
          IMG: ${{ matrix.svc.image }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          for ns in "$HUB_NS" "$ACR_NS"; do
            src="${ns}/${IMG}:${BASE}" dst="${ns}/${IMG}:${V}"
            if [ "$PUSH" != "true" ]; then
              echo "dry run: would tag $src -> $dst"
              docker buildx imagetools create --dry-run -t "$dst" "$src" | jq -c '{mediaType, n: (.manifests|length)}'
              continue
            fi
            ok=""
            for i in 1 2 3 4; do
              if docker buildx imagetools create -t "$dst" "$src"; then ok=1; break; fi
              echo "::warning::retag $dst attempt $i failed"; sleep $((i*15))
            done
            [ -n "$ok" ] || exit 1
            src_d="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$src")"
            dst_d="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$dst")"
            echo "$src ($src_d) -> $dst ($dst_d)"
            [ "$src_d" = "$dst_d" ] || echo "::warning::digest differs after retag (manifest re-serialized)"
          done

  notes:
    name: Release notes
    needs: [meta, gate, plan, image, retag]
    if: >-
      always() && !cancelled() && inputs.push && !inputs.rehearsal &&
      needs.meta.result == 'success' && needs.gate.result == 'success' &&
      needs.plan.result == 'success' &&
      (needs.image.result == 'success' || needs.image.result == 'skipped') &&
      (needs.retag.result == 'success' || needs.retag.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Render notes
        env:
          V: ${{ needs.meta.outputs.version }}
          BASE: ${{ needs.plan.outputs.base }}
          BUILD: ${{ needs.plan.outputs.build }}
          REUSE: ${{ needs.plan.outputs.reuse }}
        run: |
          set -euo pipefail
          {
            echo "### Images (v${V}, linux/amd64 + linux/arm64)"
            echo
            echo "Rebuilt: $(jq -r '[.[].image]|join(", ")' <<<"$BUILD")"
            echo
            echo "Re-tagged from ${BASE:-n/a} (unchanged): $(jq -r '[.[].image]|join(", ")' <<<"$REUSE")"
            echo
            echo '```shell'
            jq -r --arg v "$V" --arg ns "$HUB_NS" '.[].image | "docker pull \($ns)/\(.):\($v)"' <<<"$(jq -s 'add' <<<"$BUILD $REUSE")"
            echo '```'
            echo
            echo '```shell'
            jq -r --arg v "$V" --arg ns "$ACR_NS" '.[].image | "docker pull \($ns)/\(.):\($v)"' <<<"$(jq -s 'add' <<<"$BUILD $REUSE")"
            echo '```'
          } > notes.md
          cat notes.md

      - name: Append to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          body="$(gh release view "v$V" -R "$GITHUB_REPOSITORY" --json body --jq .body)"
          printf '%s\n\n%s\n' "$body" "$(cat notes.md)" > full.md
          gh release edit "v$V" -R "$GITHUB_REPOSITORY" --notes-file full.md
