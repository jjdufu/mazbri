[workspace]
members = [
    "mazbri-upstream-contracts",
    "mazbri-core",
    "mazbri-rpc",
    "mazbri-i18n",
    "mazbri-routing",
    "mazbri-admin",
    "mazbri-tls",
    "mazbri-billing",
    "mazbri-service",
    "mazbri-auth",
    "mazbri-cache",
    "mazbri-product",
    "mazbri-registry",
    "mazbri-callback",
    "mazbri-cert",
    "mazbri-crypto",
    "mazbri-upstream-runtime",
    "mazbri-audit"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
authors = ["Mazbri Team"]
license = "MIT"

[workspace.dependencies]
mazbri-rpc = { version = "0.1.0", path = "mazbri-rpc" }
mazbri-admin = { version = "0.1.0", path = "mazbri-admin" }
mazbri-core = { version = "0.1.0", path = "mazbri-core" }
mazbri-tls = { version = "0.1.0", path = "mazbri-tls" }
mazbri-crypto = { version = "0.1.0", path = "mazbri-crypto" }
mazbri-auth = { version = "0.1.0", path = "mazbri-auth" }
mazbri-registry = { version = "0.1.0", path = "mazbri-registry" }

tokio = {version = "1.35", features = ["full"]}
tokio-util = {version = "0.7", features = ["rt"]}
axum = {version = "0.8.8", features = ["macros", "multipart", "tower-log", "ws"]}
tower = {version = "0.5.3", features = ["full", "discover", "load"]}
tower-http = {version = "0.6.8", features = ["trace", "cors", "compression-gzip"]}
http = "1.4.0"
sqlx = {version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "derive", "chrono", "uuid", "json", "rust_decimal", "ipnetwork"]}
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
pin-project-lite = "0.2"
toml = "1.2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = {version = "0.3", features = ["env-filter", "json"]}
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "rt-tokio"] }
# reqwest-blocking-client: BatchSpanProcessor runs on a dedicated thread without
# a Tokio reactor; async reqwest panics there. Blocking client is the OTel default.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry-semantic-conventions = "0.32"
tracing-opentelemetry = "0.33"
flate2 = "1.0"
prometheus = "0.14"
anyhow = "1.0"
thiserror = "2.0"
uuid = {version = "1.21", features = ["v4", "v7", "serde"]}
chrono = {version = "0.4", features = ["serde"]}
rust-i18n = "4"
rust_decimal = {version = "1.32", features = ["serde"]}
futures = "0.3"
futures-util = "0.3"
reqwest = {version = "0.13.2", default-features = false, features = ["json", "gzip", "multipart", "rustls"]}
tonic = {version = "0.14.6", features = ["transport", "tls-aws-lc"]}
prost = "0.14.3"
argon2 = "0.6"
jsonwebtoken = {version = "12.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"]}
async-trait = "0.1"
dashmap = "6.1.0"
lru = "0.16.3"
moka = {version = "0.12", features = ["sync", "future"]}
rand = "0.10.0"
tarpc = {version = "0.38", features = ["tokio1", "serde-transport", "tcp", "serde-transport-bincode", "serde-transport-json"]}
base64 = "0.23"
sha2 = "0.11"
parking_lot = "0.12"
hex = "0.4"
redis = { version = "1.8", default-features = false, features = ["acl", "streams", "geospatial", "script", "tokio-comp", "connection-manager", "aio", "cluster-async"] }
aes-gcm = "0.11"
hkdf = "0.13"
hmac = "0.13"
zeroize = { version = "1.8", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets"] }

chacha20poly1305 = "0.11"
subtle = "2.6"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
cipher = { version = "0.5", features = ["alloc", "block-padding"] }
ctr = "0.10"
aes = "0.9"
cfb-mode = "0.9"
cfb8 = "0.9"
blake3 = "1.5"
digest = "0.11"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "pem"] }
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "getrandom", "hazmat", "pkcs1v15"] }
sm3 = "0.5"
sm4 = "0.6"
libsm = "0.6"
des = "0.9"
md-5 = "0.11"
ecb = { version = "0.2", features = ["alloc", "block-padding"] }
der = { version = "0.8", features = ["alloc", "pem", "oid"] }
spki = { version = "0.8", features = ["alloc", "pem"] }
pkcs8 = { version = "0.11", features = ["alloc", "pem"] }
sec1 = { version = "0.8", features = ["der", "alloc"] }

[workspace.lints.rust]
unsafe_code = "warn"
[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
# unwind 让请求级 CatchPanicLayer / tarpc 响应任务真正隔离单个请求的 panic；
# 后台任务等其余 panic 由 mazbri_core::panic_policy 的 hook 直接 abort 进程。
panic = "unwind"

[profile.dev]
opt-level = 0
debug = 2
debug-assertions = true
overflow-checks = true
rpath = true

# RSA / SM2 大数运算在 debug 下极慢（测试里的 keygen / 签名可达分钟级），仅对这些依赖开优化。
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.libsm]
opt-level = 3

[profile.dev.package.num-bigint]
opt-level = 3
