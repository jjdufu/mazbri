syntax = "proto3";

package mazbri.upstream.bypass.http_proxy.v1;

import "shared/v1/common.proto";

// Code-free invoke 契约：gateway → bypass（业务 JSON + 通道 egress 规格）。
service BypassHttpProxyService {
  rpc Execute(mazbri.upstream.shared.v1.InvokeRequest)
      returns (mazbri.upstream.shared.v1.InvokeResponse);
  rpc Health(mazbri.upstream.shared.v1.HealthRequest)
      returns (mazbri.upstream.shared.v1.HealthResponse);
}
