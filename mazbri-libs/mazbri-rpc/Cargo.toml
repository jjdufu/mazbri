[package]
name = "mazbri-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Mazbri RPC service definitions using tarpc / 使用 tarpc 的 Mazbri RPC 服务定义"
authors = ["Mazbri Team"]
license = "MIT"

[dependencies]
tarpc = { workspace = true }

tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }

serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"

tracing = "0.1"

[dev-dependencies]
bincode = "1"
