[package]
name = "mazbri-upstream-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Mazbri Team"]
license = "MIT"
description = "Shared transparent upstream auth/transform/HTTP runtime (bypass + connector probe)"

[dependencies]
mazbri-core = { version = "0.1.0", path = "../mazbri-core" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hmac = "0.12"
http = "1"
jsonwebtoken = { workspace = true }
md-5 = "0.10"
prost = { workspace = true }
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
rand = { workspace = true }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "gzip", "multipart", "rustls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tracing = "0.1"
url = "2.5"
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util", "macros"] }

[lints]
workspace = true
