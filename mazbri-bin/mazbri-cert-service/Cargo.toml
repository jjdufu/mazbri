[package]
name = "mazbri-cert-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "mazbri-cert-service"
path = "src/main.rs"
[dependencies]
mazbri-core = { workspace = true }
mazbri-service = { workspace = true }
mazbri-rpc = { workspace = true }
mazbri-tls = { workspace = true }
mazbri-admin = { workspace = true }
mazbri-cert = { workspace = true }
mazbri-audit = { workspace = true }
mazbri-crypto = { workspace = true }

tokio = { workspace = true }

tarpc = { workspace = true }

axum = { workspace = true, features = ["multipart", "tower-log", "ws"] }
tower = { workspace = true, features = ["full", "discover", "load"] }
tower-http = { workspace = true }

sqlx = { workspace = true, features = ["chrono", "json", "rust_decimal", "ipnetwork"] }

serde = { workspace = true }
serde_json = { workspace = true }

dotenvy = { workspace = true }

tracing = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

uuid = { workspace = true }

chrono = { workspace = true }
time = { workspace = true }

futures = { workspace = true }

rcgen = { workspace = true }

x509-parser = { workspace = true }

hkdf = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
hmac = { workspace = true }

toml = { workspace = true }
toml_edit = { workspace = true }

subtle = { workspace = true }

parking_lot = { workspace = true }

prometheus = { workspace = true }

[dev-dependencies]
mazbri-audit = { workspace = true, features = ["testing"] }
serde_yaml = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true
