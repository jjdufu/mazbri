[package]
name = "mazbri-cert-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Mazbri Team"]
license = "MIT"

[[bin]]
name = "mazbri-cert-service"
path = "src/main.rs"
[dependencies]
mazbri-core = { version = "0.1.0", registry = "cargo-hosted" }
mazbri-service = { version = "0.1.0", registry = "cargo-hosted" }
mazbri-rpc = { version = "0.1.0", registry = "cargo-hosted" }
mazbri-tls = { version = "0.1.0", registry = "cargo-hosted" }
mazbri-admin = { version = "0.1.0", registry = "cargo-hosted" }
mazbri-cert = { version = "0.1.0", registry = "cargo-hosted" }

tokio = {version = "1.35", features = ["full"]}

tarpc = {version = "0.35", features = ["tokio1", "serde-transport", "tcp", "serde-transport-bincode", "serde-transport-json"]}

axum = {version = "0.8.8", features = ["macros", "multipart", "tower-log", "ws"]}
tower = {version = "0.5.3", features = ["full", "discover", "load"]}
tower-http = {version = "0.6.8", features = ["trace", "cors", "compression-gzip"]}

sqlx = {version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "rust_decimal", "ipnetwork"]}

serde = {version = "1.0", features = ["derive"]}
serde_json = {version = "1.0"}

config = {version = "0.15"}
dotenvy = {version = "0.15"}

tracing = {version = "0.1"}

anyhow = {version = "1.0"}
thiserror = {version = "2.0"}

uuid = {version = "1.21", features = ["v4", "serde"]}

chrono = {version = "0.4", features = ["serde"]}
time = "=0.3.47"

futures = {version = "0.3"}

rcgen = { version = "0.13", features = ["x509-parser", "pem"] }

x509-parser = "0.16"

aes-gcm = "0.10"
hkdf = {version = "0.12"}
hex = {version = "0.4"}
sha2 = {version = "0.10"}
base64 = "0.22"
rand = {version = "0.10.0"}
argon2 = {version = "0.5"}
zeroize = "1.8"
hmac = "0.12"

toml = "0.8"
toml_edit = "0.22"

subtle = "2.6"

parking_lot = {version = "0.12"}

prometheus = {version = "0.14"}
