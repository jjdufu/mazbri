[package]
name = "mazbri-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Mazbri Team"]
license = "MIT"

[[bin]]
name = "mazbri-gateway"
path = "src/main.rs"

[dependencies]
mazbri-core = { version = "0.1.0", path = "../../mazbri-libs/mazbri-core" }
mazbri-registry = { version = "0.1.0", path = "../../mazbri-libs/mazbri-registry" }
mazbri-service = { version = "0.1.0", path = "../../mazbri-libs/mazbri-service" }
mazbri-admin = { version = "0.1.0", path = "../../mazbri-libs/mazbri-admin" }
mazbri-upstream-contracts = { version = "0.1.0", path = "../../mazbri-libs/mazbri-upstream-contracts" }

mazbri-rpc = { version = "0.1.0", path = "../../mazbri-libs/mazbri-rpc" }
tarpc = {version = "0.35", features = ["tokio1", "serde-transport", "tcp", "serde-transport-bincode", "serde-transport-json"]}
tokio-serde = {version = "0.9", features = ["bincode", "json"]}
tonic = {version = "0.14.6", features = ["transport", "tls-aws-lc"]}
tonic-prost = {version = "0.14.6"}
rust_decimal = {version = "1.32", features = ["serde"]}
futures = {version = "0.3"}

axum = {version = "0.8.8", features = ["macros", "multipart", "tower-log", "ws"]}
tower = {version = "0.5.3", features = ["full", "discover", "load"]}
tower-http = {version = "0.6.8", features = ["trace", "cors", "compression-gzip", "limit", "catch-panic"]}
http = {version = "1.4.0"}
http-body = {version = "1"}
socket2 = {version = "0.5"}

tokio = {version = "1.35", features = ["full"]}

serde = {version = "1.0", features = ["derive"]}
serde_json = {version = "1.0"}

config = {version = "0.15"}
dotenvy = {version = "0.15"}
clap = {version = "4", features = ["derive"]}

tracing = {version = "0.1"}

anyhow = {version = "1.0"}
thiserror = {version = "2.0"}

prometheus = {version = "0.14"}

reqwest = {version = "0.13.2", default-features = false, features = ["json", "gzip", "multipart", "rustls"]}

mazbri-product = { version = "0.1.0", path = "../../mazbri-libs/mazbri-product" }
mazbri-routing = { version = "0.1.0", path = "../../mazbri-libs/mazbri-routing" }
mazbri-callback = { version = "0.1.0", path = "../../mazbri-libs/mazbri-callback" }
mazbri-auth = { version = "0.1.0", path = "../../mazbri-libs/mazbri-auth" }
mazbri-cache = { version = "0.1.0", path = "../../mazbri-libs/mazbri-cache" }
mazbri-billing = { version = "0.1.0", path = "../../mazbri-libs/mazbri-billing" }
sqlx = {version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "rust_decimal", "ipnetwork"]}
uuid = {version = "1.21", features = ["v4", "v5", "serde"]}

jsonwebtoken = {version = "10.3.0", default-features = false, features = ["aws_lc_rs", "use_pem"]}

chrono = {version = "0.4", features = ["serde"]}

serde_urlencoded = {version = "0.7"}

mazbri-tls = { version = "0.1.0", path = "../../mazbri-libs/mazbri-tls" }
async-trait = {version = "0.1"}
dashmap = {version = "6.1.0"}
moka = {version = "0.12", features = ["sync", "future"]}
redis = {version = "0.27", features = ["tokio-comp", "connection-manager", "aio"]}
sha2 = {version = "0.10"}
hex = {version = "0.4"}
rand = {version = "0.10.0"}
base64 = {version = "0.22"}
parking_lot = {version = "0.12"}
arc-swap = {version = "1.7.1"}
