[package]
name = "mazbri-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "mazbri-gateway"
path = "src/main.rs"

[dependencies]
mazbri-core = { workspace = true }
mazbri-registry = { workspace = true }
mazbri-service = { workspace = true }
mazbri-admin = { workspace = true }
mazbri-upstream-contracts = { workspace = true }

mazbri-rpc = { workspace = true }
tarpc = { workspace = true }
tokio-serde = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
rust_decimal = { workspace = true }
futures = { workspace = true }

axum = { workspace = true, features = ["multipart", "tower-log", "ws"] }
tower = { workspace = true, features = ["full", "discover", "load"] }
tower-http = { workspace = true, features = ["limit", "catch-panic"] }
http = { workspace = true }
http-body = { workspace = true }
socket2 = { workspace = true }

tokio = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

dotenvy = { workspace = true }

tracing = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

prometheus = { workspace = true }

reqwest = { workspace = true }

mazbri-product = { workspace = true }
mazbri-routing = { workspace = true }
mazbri-callback = { workspace = true }
mazbri-auth = { workspace = true }
mazbri-cache = { workspace = true }
mazbri-billing = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "json", "rust_decimal", "ipnetwork"] }
uuid = { workspace = true, features = ["v5"] }

jsonwebtoken = { workspace = true }

chrono = { workspace = true }

serde_urlencoded = { workspace = true }

mazbri-tls = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
moka = { workspace = true, features = ["future"] }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
ipnetwork = { workspace = true }
zeroize = { workspace = true }
mimalloc = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
toml = { workspace = true }
bincode = { workspace = true }
