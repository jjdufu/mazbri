[package]
name = "mazbri-mgmt"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Mazbri Team"]
license = "MIT"

[lib]
name = "mazbri_mgmt"
path = "src/lib.rs"

[[bin]]
name = "mazbri-mgmt"
path = "src/main.rs"

[dependencies]
mazbri-core = { version = "0.1.0", path = "../../mazbri-libs/mazbri-core" }
mazbri-auth = { version = "0.1.0", path = "../../mazbri-libs/mazbri-auth" }
mazbri-billing = { version = "0.1.0", path = "../../mazbri-libs/mazbri-billing" }
mazbri-service = { version = "0.1.0", path = "../../mazbri-libs/mazbri-service" }
mazbri-product = { version = "0.1.0", path = "../../mazbri-libs/mazbri-product" }
mazbri-callback = { version = "0.1.0", path = "../../mazbri-libs/mazbri-callback" }
mazbri-cache = { version = "0.1.0", path = "../../mazbri-libs/mazbri-cache" }
mazbri-i18n = { version = "0.1.0", path = "../../mazbri-libs/mazbri-i18n" }
mazbri-admin = { version = "0.1.0", path = "../../mazbri-libs/mazbri-admin" }
mazbri-upstream-runtime = { version = "0.1.0", path = "../../mazbri-libs/mazbri-upstream-runtime" }
mazbri-audit = { version = "0.1.0", path = "../../mazbri-libs/mazbri-audit" }

time = { version = "=0.3.47", features = ["formatting", "parsing"] }
axum = {version = "0.8.8", features = ["macros", "multipart", "tower-log", "ws"]}
tower = {version = "0.5.3", features = ["full", "discover", "load"]}
tower-http = {version = "0.6.8", features = ["trace", "cors", "compression-gzip", "fs", "limit", "catch-panic"]}

tokio = {version = "1.35", features = ["full"]}

sqlx = {version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "rust_decimal", "ipnetwork"]}
rust_decimal = {version = "1.32", features = ["serde"]}

serde = {version = "1.0", features = ["derive"]}
serde_json = {version = "1.0"}

chrono = {version = "0.4", features = ["serde"]}

config = {version = "0.15"}
dotenvy = {version = "0.15"}
clap = {version = "4", features = ["derive"]}

tracing = {version = "0.1"}

anyhow = {version = "1.0"}
thiserror = {version = "2.0"}
ts-rs = { version = "12.0", features = ["uuid-impl", "chrono-impl"] }

url = "2"

uuid = {version = "1.21", features = ["v4", "serde"]}

rand = {version = "0.10.0"}

argon2 = {version = "0.5"}
sha2 = {version = "0.10"}

base64 = "0.22"

ipnetwork = "0.20"

jsonwebtoken = {version = "10.3.0", default-features = false, features = ["aws_lc_rs", "use_pem"]}

reqwest = {version = "0.13.2", default-features = false, features = ["json", "gzip", "multipart", "rustls", "http2"]}
prometheus = {version = "0.14"}

totp-lite = {version = "2.0"}
qrcode = {version = "0.14"}
aes-gcm = {version = "0.10"}
hkdf = {version = "0.12"}
base32 = {version = "0.5"}
hex = "0.4"
zeroize = "1.8"
sha1 = "0.10"
subtle = "2.6"
urlencoding = "2.1"

rust-embed = {version = "8.7", features = ["interpolate-folder-path"]}
mime_guess = {version = "2.0"}

toml = "0.8"
toml_edit = "0.22"

md5 = "0.7"

moka = {version = "0.12", features = ["sync", "future"]}

zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
mazbri-audit = { version = "0.1.0", path = "../../mazbri-libs/mazbri-audit", features = ["testing"] }

[build-dependencies]
mazbri-core = { version = "0.1.0", path = "../../mazbri-libs/mazbri-core" }
mazbri-product = { version = "0.1.0", path = "../../mazbri-libs/mazbri-product" }
serde = {version = "1.0", features = ["derive"]}
ts-rs = { version = "12.0", features = ["uuid-impl", "chrono-impl"] }

[lints]
workspace = true
