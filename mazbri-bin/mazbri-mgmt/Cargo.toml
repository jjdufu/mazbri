[package]
name = "mazbri-mgmt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "mazbri_mgmt"
path = "src/lib.rs"

[[bin]]
name = "mazbri-mgmt"
path = "src/main.rs"

[dependencies]
mazbri-core = { workspace = true }
mazbri-auth = { workspace = true }
mazbri-billing = { workspace = true }
mazbri-service = { workspace = true }
mazbri-product = { workspace = true }
mazbri-callback = { workspace = true }
mazbri-cache = { workspace = true }
mazbri-i18n = { workspace = true }
mazbri-admin = { workspace = true }
mazbri-upstream-runtime = { workspace = true }
mazbri-upstream-contracts = { workspace = true }
mazbri-audit = { workspace = true }
mazbri-crypto = { workspace = true }

time = { workspace = true, features = ["formatting", "parsing"] }
axum = { workspace = true, features = ["multipart", "tower-log", "ws"] }
tower = { workspace = true, features = ["full", "discover", "load"] }
tower-http = { workspace = true, features = ["fs", "limit", "catch-panic"] }

tokio = { workspace = true }

sqlx = { workspace = true, features = ["chrono", "json", "rust_decimal", "ipnetwork"] }
rust_decimal = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

chrono = { workspace = true }

config = { workspace = true }
dotenvy = { workspace = true }
clap = { workspace = true }

tracing = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true }

url = { workspace = true }

uuid = { workspace = true }

rand = { workspace = true }

argon2 = { workspace = true }
sha2 = { workspace = true }

base64 = { workspace = true }

ipnetwork = { workspace = true }

jsonwebtoken = { workspace = true }

reqwest = { workspace = true, features = ["http2"] }
prometheus = { workspace = true }

hmac = { workspace = true }
qrcode = { workspace = true }
hkdf = { workspace = true }
base32 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
sha1 = { workspace = true }
subtle = { workspace = true }
urlencoding = { workspace = true }

rust-embed = { workspace = true }
mime_guess = { workspace = true }

toml = { workspace = true }
toml_edit = { workspace = true }

moka = { workspace = true, features = ["future"] }

zip = { workspace = true }

[dev-dependencies]
mazbri-audit = { workspace = true, features = ["testing"] }

[build-dependencies]
mazbri-core = { workspace = true }
mazbri-product = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true }

[lints]
workspace = true
