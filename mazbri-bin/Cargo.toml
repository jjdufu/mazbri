[workspace]
members = [
    "mazbri-analytics",
    "mazbri-auth-service",
    "mazbri-billing-service",
    "mazbri-bypass",
    "mazbri-cache-service",
    "mazbri-cbpro-ext-service",
    "mazbri-cbpro-service",
    "mazbri-cert-service",
    "mazbri-gateway",
    "mazbri-mgmt",
    "mazbri-ratelimit-service"
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "warn"
[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
